name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    env:
      # openSettings is back-deployed to macOS 14, but needs the newer SDK to compile.
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Check Settings window presentation
        run: |
          swiftc -parse-as-library Sources/RangeAnxiety/SettingsWindowPresenter.swift Tests/SettingsWindowSmoke/main.swift -o "$RUNNER_TEMP/settings-window-smoke"
          "$RUNNER_TEMP/settings-window-smoke"
      - name: Build app bundle with icon
        run: ./build.sh
